name: Validate package

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package structure, QML syntax and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 shellcheck qt6-declarative-dev-tools

      - name: Validate package metadata and structure
        run: |
          python3 -m json.tool package/metadata.json >/dev/null
          python3 tests/check_package.py

      - name: Parse QML files
        shell: bash
        run: |
          qmlformat_bin="$(command -v qmlformat || true)"
          if [[ -z "$qmlformat_bin" && -x /usr/lib/qt6/bin/qmlformat ]]; then
            qmlformat_bin=/usr/lib/qt6/bin/qmlformat
          fi
          if [[ -z "$qmlformat_bin" ]]; then
            echo "qmlformat was not installed" >&2
            exit 1
          fi
          "$qmlformat_bin" package/contents/ui/main.qml >/dev/null
          "$qmlformat_bin" package/contents/ui/WindowCard.qml >/dev/null
          "$qmlformat_bin" package/contents/ui/ShortcutHint.qml >/dev/null

      - name: Check shell scripts
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          shellcheck --severity=error install.sh uninstall.sh

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
